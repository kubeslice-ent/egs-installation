# kubetally-report reads GPRs (GPR details for token usage rows) and, with tokenUsage.source
# "workerslicegpr", the WorkerSliceGPR status.tokenUsage totals published by kube-aiops-operator
# to store LLM token usage per GPR in gpr_token_usage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetally-report
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubetally-token-reader
rules:
- apiGroups: ["gpr.kubeslice.io"]
  resources: ["gpuprovisioningrequests"]
  verbs: ["get", "list"]
- apiGroups: ["worker.kubeslice.io"]
  resources: ["workerslicegpuprovisioningrequests"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubetally-token-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubetally-token-reader
subjects:
- kind: ServiceAccount
  name: kubetally-report
  namespace: {{ .Release.Namespace }}
