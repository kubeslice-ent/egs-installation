---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: workspacedatastores.gpr.kubeslice.io
spec:
  group: gpr.kubeslice.io
  names:
    kind: WorkspaceDataStore
    listKind: WorkspaceDataStoreList
    plural: workspacedatastores
    shortNames:
    - wds
    singular: workspacedatastore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workspaceName
      name: Workspace
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.backendRef.name
      name: Backend
      type: string
    - jsonPath: .status.pvcName
      name: PVC
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkspaceDataStore is a workspace-scoped JuiceFS filesystem. Every worker cluster it is attached
          to mounts the same directory through a PVC named wds-<name>; an S3 gateway serves the same data.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkspaceDataStoreSpec defines the desired state of WorkspaceDataStore.
            properties:
              adoptExisting:
                description: adoptExisting re-uses data already present in subdir
                  instead of refusing a non-empty one.
                type: boolean
              attachments:
                description: |-
                  attachments are explicit (cluster, namespace) pairs to create the PVC in. WorkloadPlacements
                  that reference this data store add their own automatically.
                items:
                  description: WorkspaceDataStoreAttachment is one (cluster, namespace)
                    the data store PVC is created in.
                  properties:
                    clusterName:
                      minLength: 1
                      type: string
                    namespace:
                      minLength: 1
                      type: string
                  required:
                  - clusterName
                  - namespace
                  type: object
                type: array
              backendRef:
                description: backendRef names the DataStoreBackend (same namespace)
                  the filesystem lives in.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              cacheActions:
                description: |-
                  cacheActions are warm-up and evict requests for node caches on attached clusters. The API
                  gateway appends them and keeps the most recent 20.
                items:
                  description: WorkspaceDataStoreCacheAction asks one cluster to warm
                    up or evict its JuiceFS node caches.
                  properties:
                    action:
                      enum:
                      - Warmup
                      - Evict
                      type: string
                    clusterName:
                      minLength: 1
                      type: string
                    id:
                      minLength: 1
                      type: string
                    nodeSelector:
                      additionalProperties:
                        type: string
                      description: nodeSelector picks the nodes; empty means GPU nodes,
                        or every node without GPUs.
                      type: object
                    paths:
                      description: paths are relative to the data store root; empty
                        means everything.
                      items:
                        type: string
                      type: array
                    requestedAt:
                      format: date-time
                      type: string
                  required:
                  - action
                  - clusterName
                  - id
                  type: object
                maxItems: 20
                type: array
              displayName:
                description: 'DisplayName is the user-friendly name for this data
                  store (UI: "Display Name").'
                minLength: 1
                type: string
              gateway:
                description: gateway configures S3 access to the same data.
                properties:
                  clusterName:
                    description: |-
                      clusterName runs the gateway on this worker cluster instead of the controller cluster, near
                      the data and its readers. Requires ingressHost, which the controller cluster uses to reach it.
                    type: string
                  enabled:
                    default: true
                    description: enabled runs an S3 gateway for this data store on
                      the controller cluster. Defaults to true.
                    type: boolean
                  ingressHost:
                    description: ingressHost exposes the gateway outside the controller
                      cluster. Empty means in-cluster only.
                    type: string
                  workerEndpoint:
                    description: |-
                      workerEndpoint is the gateway URL workloads use, when they reach it at a different address
                      than the controller cluster, e.g. over a dedicated slice. Defaults to the S3 endpoint.
                    type: string
                type: object
              maxSize:
                description: maxSize is the PVC capacity, enforced on the directory
                  with `juicefs quota`.
                pattern: ^([0-9]+)(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K)?$
                type: string
              mode:
                default: SharedOrg
                description: mode selects how the filesystem is backed.
                enum:
                - None
                - SharedOrg
                - Dedicated
                type: string
              pv:
                description: pv describes the PVC workloads mount. Omitted means a
                  PVC with defaults.
                properties:
                  accessMode:
                    default: RWX
                    description: accessMode is a policy hint for how workloads mount
                      the PVC. Defaults to RWX.
                    enum:
                    - RWX
                    - RWO
                    type: string
                  enabled:
                    default: true
                    description: enabled attaches a PVC to this data store. Defaults
                      to true.
                    type: boolean
                type: object
              subdir:
                description: |-
                  subdir is the directory inside the filesystem this data store exposes. Defaults to
                  /ws/<workspace> for SharedOrg and / for Dedicated.
                pattern: ^/([A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)?$
                type: string
              workspaceName:
                description: WorkspaceName is the workspace (slice) this data store
                  belongs to.
                minLength: 1
                type: string
            required:
            - backendRef
            - displayName
            - maxSize
            - workspaceName
            type: object
          status:
            description: WorkspaceDataStoreStatus defines the observed state of WorkspaceDataStore.
            properties:
              clusters:
                description: clusters is the per-cluster PVC state reported by the
                  worker operators.
                items:
                  description: WorkspaceDataStoreClusterStatus is the data store's
                    state on one worker cluster.
                  properties:
                    cache:
                      description: cache is the per-node breakdown of cachedBytes.
                      items:
                        description: WorkspaceDataStoreNodeCache is the data store's
                          cached bytes on one node.
                        properties:
                          cachedBytes:
                            format: int64
                            type: integer
                          node:
                            type: string
                        required:
                        - cachedBytes
                        - node
                        type: object
                      type: array
                    cacheActions:
                      description: cacheActions reports this cluster's warm-up and
                        evict requests.
                      items:
                        description: WorkspaceDataStoreCacheActionStatus is the outcome
                          of one cache action on one cluster.
                        properties:
                          action:
                            type: string
                          completionTime:
                            format: date-time
                            type: string
                          failedNodes:
                            format: int32
                            type: integer
                          id:
                            type: string
                          message:
                            type: string
                          nodes:
                            format: int32
                            type: integer
                          phase:
                            description: phase is Pending, Running, Succeeded or Failed.
                            type: string
                          succeededNodes:
                            format: int32
                            type: integer
                        required:
                        - id
                        - phase
                        type: object
                      type: array
                    cacheUpdatedAt:
                      format: date-time
                      type: string
                    cachedBytes:
                      description: cachedBytes is the data store's data in node caches
                        on this cluster, summed over nodes.
                      format: int64
                      type: integer
                    clusterName:
                      type: string
                    csi:
                      description: csi is the JuiceFS CSI driver state the cluster's
                        worker operator reports.
                      properties:
                        nodes:
                          description: nodes is the number of nodes the driver is
                            registered on.
                          format: int32
                          type: integer
                        ready:
                          type: boolean
                        version:
                          type: string
                      required:
                      - ready
                      type: object
                    gatewayMessage:
                      type: string
                    gatewayReady:
                      description: gatewayReady is set on the cluster that runs the
                        data store's S3 gateway.
                      type: boolean
                    mirror:
                      description: mirror names the regional mirror this cluster reads
                        data from; empty means the primary bucket.
                      type: string
                    namespaces:
                      items:
                        description: WorkspaceDataStoreNamespaceStatus is the PVC
                          state in one namespace of one cluster.
                        properties:
                          message:
                            type: string
                          namespace:
                            type: string
                          phase:
                            description: WorkspaceDataStoreVolumePhase is the state
                              of one PVC on one worker cluster.
                            type: string
                          pvName:
                            type: string
                        required:
                        - namespace
                        type: object
                      type: array
                    secretSynced:
                      type: boolean
                  required:
                  - clusterName
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: WorkspaceDataStorePhase represents the reconciliation
                  phase of WorkspaceDataStore.
                type: string
              pvcName:
                description: 'pvcName is the PVC name workloads mount, the same on
                  every cluster: wds-<name>.'
                type: string
              s3:
                description: s3 describes S3 access through the gateway.
                properties:
                  bucket:
                    description: bucket is the bucket name the gateway serves (the
                      filesystem name).
                    type: string
                  credentialsSecretRef:
                    description: JuiceFSSecretReference points at a Secret by name
                      and namespace.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: endpoint is the external URL when an ingress host
                      is set, otherwise the in-cluster URL.
                    type: string
                  internalEndpoint:
                    description: internalEndpoint is the in-cluster gateway URL on
                      the controller cluster.
                    type: string
                  workerEndpoint:
                    description: workerEndpoint is the URL workloads on worker clusters
                      use (gateway.workerEndpoint, or endpoint).
                    type: string
                type: object
              subdir:
                description: subdir is the resolved directory inside the filesystem.
                type: string
              subdirReady:
                description: subdirReady is true once the directory and its quota
                  exist.
                type: boolean
              usage:
                description: |-
                  usage is the space used against the data store's quota, copied from its backend's last usage
                  scan. Absent until the first scan.
                properties:
                  capacityBytes:
                    format: int64
                    type: integer
                  updatedAt:
                    format: date-time
                    type: string
                  usedBytes:
                    format: int64
                    type: integer
                  usedInodes:
                    format: int64
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
