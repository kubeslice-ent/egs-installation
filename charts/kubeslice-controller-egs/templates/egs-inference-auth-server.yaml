{{- if .Values.egs.inferenceAuthServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- if .Values.egs.inferenceAuthServer.labels }}
  labels:
  {{ toYaml .Values.egs.inferenceAuthServer.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.egs.inferenceAuthServer.annotations }}
  annotations:
  {{ toYaml .Values.egs.inferenceAuthServer.annotations | nindent 4 }}
  {{- end }}
  name: egs-inference-auth-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    {{- if .Values.egs.inferenceAuthServer.labels }}
    matchLabels:
    {{ toYaml .Values.egs.inferenceAuthServer.labels | nindent 6 }}
    {{- end }}
  template:
    metadata:
      {{- if .Values.egs.inferenceAuthServer.annotations }}
      annotations:
        {{ toYaml .Values.egs.inferenceAuthServer.annotations | nindent 8 }}
      {{- end }}
      {{- if .Values.egs.inferenceAuthServer.labels }}
      labels:
      {{ toYaml .Values.egs.inferenceAuthServer.labels | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.egs.inferenceAuthServer.tolerations }}
      tolerations: {{ toYaml .Values.egs.inferenceAuthServer.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.egs.inferenceAuthServer.affinity }}
      affinity:
      {{ toYaml .Values.egs.inferenceAuthServer.affinity | nindent 8 }}
      {{- end }}
      containers:
        - name: egs-inference-auth-server
          image: {{ include "kubeslice.image" (dict "image" .Values.egs.inferenceAuthServer.image "tag" .Values.egs.inferenceAuthServer.tag "registry" .Values.global.imageRegistry) }}
          imagePullPolicy: "{{ .Values.egs.inferenceAuthServer.imagePullPolicy }}"
          {{- if .Values.egs.inferenceAuthServer.containerSecurityContext }}
          securityContext:
          {{ toYaml .Values.egs.inferenceAuthServer.containerSecurityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.egs.inferenceAuthServer.resources }}
          resources: {{ toYaml .Values.egs.inferenceAuthServer.resources | nindent 12 }}
          {{- end }}
          env:
            # DB host/port/user/password are shared with KubeTally via the same
            # postgres instance credentials; only the database name is specific
            # to this service.
            - name: DATABASE_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.kubeTally.postgresSecretName | default "kubetally-db-credentials" }}
                  key: postgresAddr
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.kubeTally.postgresSecretName | default "kubetally-db-credentials" }}
                  key: postgresPort
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.kubeTally.postgresSecretName | default "kubetally-db-credentials" }}
                  key: postgresUser
            - name: DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.kubeTally.postgresSecretName | default "kubetally-db-credentials" }}
                  key: postgresPassword
            - name: DATABASE_NAME
              value: {{ .Values.egs.inferenceAuthServer.database.name | quote }}
          ports:
            - containerPort: 8080
      securityContext:
      {{- if .Values.egs.inferenceAuthServer.podSecurityContext }}
      {{ toYaml .Values.egs.inferenceAuthServer.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- include "kubeslice.imagePullSecrets" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  {{- if .Values.egs.inferenceAuthServer.labels }}
  labels:
  {{ toYaml .Values.egs.inferenceAuthServer.labels | nindent 4 }}
  {{- end }}
  name: egs-inference-auth-server
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 8080
  selector:
    {{- if .Values.egs.inferenceAuthServer.labels }}
    {{ toYaml .Values.egs.inferenceAuthServer.labels | nindent 4 }}
    {{- end }}
  type: {{ .Values.egs.inferenceAuthServer.service.type }}
{{- end }}
